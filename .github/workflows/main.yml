name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Application Cleanly
        run: |
          # ১. ফ্রেশ ফ্ল্যাটার প্রজেক্ট তৈরি
          flutter create --org com.example full_project
          
          # ২. ফাইল কপি করা
          cp -f lib/main.dart full_project/lib/main.dart
          cp -f pubspec.yaml full_project/pubspec.yaml
          
          cd full_project
          
          # ৩. অ্যান্ড্রয়েডের জন্য প্রয়োজনীয় minSdkVersion ২১ করা
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdk/minSdk = 21/g' android/app/build.gradle || true
          
          # ৪. পারমিশন ইনজেক্ট করা
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION"/>' android/app/src/main/AndroidManifest.xml
          
          # ৫. ডিপেন্ডেন্সি আনা এবং কোড কম্পাইল
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: target-tracker-apk
          path: full_project/build/app/outputs/flutter-apk/app-release.apk
