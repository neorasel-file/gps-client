name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Auto-generate Android files & inject code
        run: |
          # অস্থায়ী ডিরেক্টরি তৈরি ও সম্পূর্ণ ফ্ল্যাটার অ্যান্ড্রয়েড প্রজেক্ট জেনারেট করা
          flutter create --org com.example temp_app
          
          # অফিসিয়াল অ্যান্ড্রয়েড ফোল্ডার কপি করা (যদি না থাকে)
          if [ ! -d "android" ]; then
            cp -r temp_app/android ./android
          fi

          # পারমিশন যুক্ত করা
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION"/>' android/app/src/main/AndroidManifest.xml

          # minSdkVersion ২১ নিশ্চিত করা
          sed -i 's/minSdkVersion = .*/minSdkVersion = 21/g' android/app/build.gradle || true
          sed -i 's/minSdk = .*/minSdk = 21/g' android/app/build.gradle || true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: target-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
